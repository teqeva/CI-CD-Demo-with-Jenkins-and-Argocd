apiVersion: v1
kind: ConfigMap
metadata:
  name: site-config
  namespace: week10-cicd
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Week 10 CI/CD Demo v2.0</title>
      <style>
        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
        }
        
        body {
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
          background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
          min-height: 100vh;
          display: flex;
          justify-content: center;
          align-items: center;
          padding: 20px;
        }
        
        .container {
          max-width: 720px;
          width: 100%;
          padding: 2.5rem;
          background: #ffffff;
          border-radius: 16px;
          box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        
        h1 {
          margin-top: 0;
          color: #333;
          font-size: 2rem;
          display: flex;
          align-items: center;
          gap: 12px;
        }
        
        .badge {
          display: inline-block;
          background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
          color: white;
          padding: 4px 16px;
          border-radius: 20px;
          font-size: 14px;
          font-weight: 600;
          margin-left: 8px;
        }
        
        .subtitle {
          color: #666;
          margin-bottom: 1.5rem;
          font-size: 1.1rem;
        }
        
        .info {
          background: #f8f9fa;
          padding: 1.5rem;
          border-radius: 8px;
          margin: 1.5rem 0;
          border-left: 4px solid #667eea;
        }
        
        .version {
          color: #667eea;
          font-weight: bold;
          font-size: 1.2rem;
        }
        
        .updated {
          color: #28a745;
          font-weight: bold;
        }
        
        .timestamp {
          color: #6c757d;
          font-size: 14px;
          margin-top: 8px;
        }
        
        ul {
          list-style: none;
          padding: 0;
          margin: 1.5rem 0;
        }
        
        ul li {
          padding: 10px 0;
          border-bottom: 1px solid #f0f0f0;
          display: flex;
          align-items: center;
          gap: 10px;
        }
        
        ul li:last-child {
          border-bottom: none;
        }
        
        .check {
          color: #28a745;
          font-weight: bold;
        }
        
        .status-grid {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 12px;
          margin: 1.5rem 0;
        }
        
        .status-item {
          background: #f8f9fa;
          padding: 12px;
          border-radius: 8px;
          text-align: center;
        }
        
        .status-item .label {
          font-size: 12px;
          color: #6c757d;
          text-transform: uppercase;
          letter-spacing: 0.5px;
        }
        
        .status-item .value {
          font-size: 1.1rem;
          font-weight: 600;
          color: #333;
        }
        
        .status-item .value.healthy {
          color: #28a745;
        }
        
        .status-item .value.synced {
          color: #667eea;
        }
        
        .footer {
          margin-top: 1.5rem;
          padding-top: 1rem;
          border-top: 1px solid #f0f0f0;
          color: #6c757d;
          font-size: 14px;
          text-align: center;
        }
        
        @media (max-width: 600px) {
          .container {
            padding: 1.5rem;
          }
          h1 {
            font-size: 1.5rem;
            flex-wrap: wrap;
          }
          .status-grid {
            grid-template-columns: 1fr;
          }
        }
      </style>
    </head>
    <body>
      <main class="container">
        <h1>
          Week 10 CI/CD Demo
          <span class="badge">v2.0</span>
        </h1>
        <p class="subtitle">Deployed using Jenkins and ArgoCD</p>
        
        <div class="info">
          <p><span class="version">Version:</span> 2.0.0</p>
          <p><span class="updated">Updated via GitOps</span></p>
          <p>Deployed from ConfigMap</p>
          <p class="timestamp">Updated at: <span id="timestamp"></span></p>
        </div>
        
        <div class="status-grid">
          <div class="status-item">
            <div class="label">CI Status</div>
            <div class="value healthy">Passing</div>
          </div>
          <div class="status-item">
            <div class="label">CD Status</div>
            <div class="value synced">Synced</div>
          </div>
          <div class="status-item">
            <div class="label">Deployment</div>
            <div class="value healthy">Live</div>
          </div>
          <div class="status-item">
            <div class="label">GitOps</div>
            <div class="value synced">Applied</div>
          </div>
        </div>
        
        <ul>
          <li><span class="check">[OK]</span> CI: Jenkins pipeline</li>
          <li><span class="check">[OK]</span> CD: ArgoCD GitOps sync</li>
          <li><span class="check">[OK]</span> Platform: Kubernetes</li>
          <li><span class="check">[OK]</span> ConfigMap: GitOps driven</li>
          <li><span class="check">[OK]</span> Task 5: GitOps Update Demo</li>
        </ul>
        
        <div class="footer">
          Updated by GitOps
        </div>
      </main>
      <script>
        document.getElementById('timestamp').textContent = new Date().toLocaleString();
      </script>
    </body>
    </html>
